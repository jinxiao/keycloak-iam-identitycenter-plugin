name: Release Provider and Theme JARs

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ARTIFACT_ID: keycloak-aws-identitycenter-sync

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Resolve release version
        id: release_version
        shell: bash
        run: |
          TAG='${{ github.event.release.tag_name }}'
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build with Maven
        run: mvn -B -DskipTests -Drevision=${{ steps.release_version.outputs.version }} package --file pom.xml

      - name: Prepare release assets
        shell: bash
        run: |
          VERSION='${{ steps.release_version.outputs.version }}'
          PROVIDER_SOURCE="target/${ARTIFACT_ID}-${VERSION}.jar"
          THEME_SOURCE="target/${ARTIFACT_ID}-${VERSION}-themes.jar"
          PROVIDER_RELEASE="release-assets/${ARTIFACT_ID}-provider-${VERSION}.jar"
          THEME_RELEASE="release-assets/${ARTIFACT_ID}-admin-theme-${VERSION}.jar"

          test -f "$PROVIDER_SOURCE"
          test -f "$THEME_SOURCE"

          mkdir -p release-assets
          cp "$PROVIDER_SOURCE" "$PROVIDER_RELEASE"
          cp "$THEME_SOURCE" "$THEME_RELEASE"

          ls -lh release-assets

      - name: Upload provider and admin theme JARs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            release-assets/keycloak-aws-identitycenter-sync-provider-${{ steps.release_version.outputs.version }}.jar
            release-assets/keycloak-aws-identitycenter-sync-admin-theme-${{ steps.release_version.outputs.version }}.jar
